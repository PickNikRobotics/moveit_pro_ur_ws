# Tier 1 CI — build + colcon test + objective lint.
# See design_docs/ci.md for design rationale, bump procedure, and failure triage.

name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Full MoveIt Pro image ref; '{0}' is replaced by the ROS distro (defaults to 'picknikciuser/moveit-pro:10.0.0-{0}')"
        type: string
        required: false

permissions:
  contents: read

jobs:
  ensure-no-ssh-in-gitmodules:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject SSH submodule URLs
        run: |
          # Match only `url = git@...` or `url = ssh://...` lines (the actual
          # submodule URL fields), not arbitrary `git@` substrings elsewhere
          # in the file (comments, other key names, etc).
          if [ -f .gitmodules ] && grep -qE '^[[:space:]]*url[[:space:]]*=[[:space:]]*(git@|ssh://)' .gitmodules; then
            echo "::error::Found SSH submodule URL in .gitmodules — use https:// for CI compatibility"
            grep -nE '^[[:space:]]*url[[:space:]]*=[[:space:]]*(git@|ssh://)' .gitmodules
            exit 1
          fi

  validate_objectives:
    # Submodules are intentionally NOT fetched here. The v0.0.1 lint globs
    # **/*.xml and attempts xml.etree.parse on every match. Well-formed
    # non-BT XML (launch XML, plugin_description.xml, robot description)
    # parses fine and is silently skipped because there's no <BehaviorTree>
    # element — those files don't cause failures. The failure mode is
    # files that aren't standalone-parseable XML at all, e.g. MuJoCo
    # <include> fragments some third-party submodules ship, which
    # lack a root element. Our objectives all live in
    # src/picknik_009_ur5e_*/objectives/, so this job has no use for
    # submodule contents. `submodules: false` is the actions/checkout
    # default; setting it explicitly so shared defaults can't silently
    # re-enable submodule fetch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: PickNikRobotics/moveit_pro_lint@v0.0.1

  integration_test:
    # Omitting `config_package:` switches the reusable workflow from
    # `colcon build --packages-up-to <pkg>` + `colcon test --packages-select <pkg>`
    # to a full-workspace build + `colcon test --packages-skip <external_dependencies>`.
    # This is what we want: the custom C++ behavior packages
    # (shelf_stocking_behaviors, pcl_nn_filter,
    # get_graspable_grocery_objects_from_masks3d) are loaded at runtime via
    # pluginlib, so they don't appear in any config package's package.xml and
    # would be skipped under --packages-up-to. Their gtest suites are where
    # the workspace's real test coverage lives. See design_docs/ci.md.
    uses: PickNikRobotics/moveit_pro_ci/.github/workflows/workspace_integration_test.yaml@v0.9.1
    with:
      # `image_ref`, not `image_tag`: Pro 10 publishes to a RENAMED Docker Hub
      # repo (picknikciuser/moveit-pro), while `image_tag` still formats the
      # Pro 9 name (picknikciuser/moveit-studio:<tag>-<distro>), which has no
      # 10.x tag at all. `image_ref` overrides the whole reference; the `{0}`
      # is substituted with the matrix's ros_distro by the reusable workflow.
      image_ref: ${{ github.event.inputs.image_ref || 'picknikciuser/moveit-pro:10.0.0-{0}' }}
      # Jazzy only. This workspace is Pro 10 / Jazzy and does not build on
      # Humble -- <tl/expected.hpp> exists only on Pro 10, so the humble leg of
      # the default '["humble", "jazzy"]' matrix fails at compile time.
      ros_distros: '["jazzy"]'
      # Override the mixin list from the workspace's colcon-defaults.yaml. That file is
      # tuned for dev workflows and turns on `rel-with-deb-info` plus `coverage-gcc` /
      # `coverage-pytest`; on a GitHub-hosted runner the resulting debug symbols and gcov
      # instrumentation exhaust the disk and the job dies mid-`colcon test` with
      # "No space left on device" *after* a successful build. Nothing in CI consumes the
      # coverage data, so it is pure cost here. `build-testing-on` is retained and is
      # load-bearing: without it no test targets are built and `colcon test` would find
      # nothing to run, which looks green while testing nothing. `--cmake-args` must come
      # last, because it swallows every later argument.
      colcon_build_args: "--mixin lld compile-commands build-testing-on --cmake-args -DCMAKE_BUILD_TYPE=Release"
      colcon_test_args: "--executor sequential"
      runner: "ubuntu-22.04"
    secrets:
      moveit_license_key: ${{ secrets.MOVEIT_LICENSE_KEY }}
