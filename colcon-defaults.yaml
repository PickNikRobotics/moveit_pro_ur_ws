# Contains colcon default settings for user overlay containers.
build:
  # Enable this for bidirectional syncing from the UI
  symlink-install: true
  # zed_debug (zed-ros2-wrapper 5.x) links an executable against the ZED SDK, which needs
  # libcuda.so.1 at link time. The build container gets no GPU, so it cannot link, and
  # nothing here uses it. See design_docs/zed_shelf_cam.md.
  packages-ignore:
    - zed_debug
  allow-overriding:
    - robotiq_description
    - ur_description
  mixin:
    # Enable ccache support
    - ccache
    # Multithreaded linker to speed up linking step during compilation
    - lld
    - compile-commands
    # Debug info and build testing for dev workflows
    - rel-with-deb-info
    - build-testing-on
    - coverage-gcc
    - coverage-pytest
test:
  packages-ignore:
    - zed_debug
  event-handlers:
    - console_direct+
    - desktop_notification+
