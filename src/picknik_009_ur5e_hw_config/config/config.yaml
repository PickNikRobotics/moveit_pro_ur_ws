# Gripper-neutral UR5e 009 hardware base: the UR driver, cameras, calibration and robot
# IP shared by every end effector. Not meant to be run on its own: run a gripper config
# based on it, picknik_009_ur5e_vacuum_config (EPick suction) or
# picknik_009_ur5e_2f85_hw_config (Robotiq 2F-85). It is based on the mock config, not
# the sim, so the suction sim's Objectives and the suction-only adapters/epick library
# stay out of the 2-finger config. See design_docs/end_effector_variants.md.
based_on_package: "picknik_009_ur5e_config"

# [Required]
hardware:
  # Real hardware is selected via `use_fake_hardware: "false"` in urdf_params below. The
  # `simulated` flag was removed in MoveIt Pro 10.0 (inherited base sets use_fake_hardware
  # "true"; this config overrides it to "false").

  # If the MoveIt Pro Agent should launch the ros2 controller node.
  # [Optional, default=True]
  # launch_control_node: True

  # If the MoveIt Pro Agent should launch the robot state publisher.
  # This should be false if you are launching the robot state publisher as part of drivers.
  # [Optional, default=True]
  # launch_robot_state_publisher: True

  # Renamed from robot_driver_persist_launch_file (removed in MoveIt Pro 10.0). Runs with the
  # MoveIt Pro Drivers process and persists across Agent restarts.
  additional_driver_launch_file:
    package: "picknik_009_ur5e_hw_config"
    path: "launch/robot_drivers_to_persist.launch.py"

  # Parameters used to configure the robot description through XACRO.
  # A URDF and SRDF are both required.
  # [Required]
  robot_description:
    # urdf:
    #   package: "picknik_009_ur5e_config"
    #   path: "description/picknik_009_ur5e.urdf.xacro"
    # srdf:
    #   package: "picknik_009_ur5e_config"
    #   path: "config/moveit/picknik_009_ur5e.srdf"
    # Specify any additional parameters required for the URDF.
    # Many of these are specific to the UR descriptions packages, and can be customized as needed.
    # [Optional]
    urdf_params:
      # - name: "ur5e"
      # NOTE: If using a different UR model, update type here and joint limits in the config/moveit/joint_limits.yaml file.
      # possible 'ur_type' values: ur3, ur3e, ur5, ur5e, ur10, ur10e, ur16e, ur20, ur30
      # - ur_type: "ur5e"
      - use_fake_hardware: "false"
      - robot_ip: "192.10.0.11"
      # - has_tool_changer: "false"
      # - headless_mode: "true"
      # - use_tool_communication: "true"
      - tool_voltage: "24"
      # This arm's factory kinematics instead of the nominal UR5e values; see the
      # use_calibrated_kinematics arg in picknik_009_ur5e.urdf.xacro.
      - use_calibrated_kinematics: "true"
      # - joint_limit_parameters_file:
      #     package: "picknik_009_ur5e_config"
      #     path: "config/moveit/joint_limits.yaml"

objectives:
  objective_library_paths:
    # The x<N>_ prefix is load-bearing: Pro 10 picks the winning file by the ALPHABETICAL order of these ids (see design_docs/objective_library_precedence.md). Keep x1 base < x3 hw < x4 gripper config.
    x3_hw_objectives:
      package_name: "picknik_009_ur5e_hw_config"
      relative_path: "objectives"

# No ros2_control section: the controllers belong to the gripper, so each gripper config
# sets its own (picknik_009_ur5e_vacuum_config, picknik_009_ur5e_2f85_hw_config).
