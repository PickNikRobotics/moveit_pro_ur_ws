# Calibration-only parameter overrides for the shelf_cam ZED 2i, selected by
# cameras.launch.xml when calibration_mode is true.
# zed_wrapper takes one override file, so this repeats zed_shelf_cam.yaml and
# adds the full-resolution keys. See design_docs/board_based_calibration.md.
---
/**:
  ros__parameters:
    general:
      grab_frame_rate: 30
      pub_frame_rate: 10.0
      # Full HD with no downscale, so the back-wall board has enough pixels.
      grab_resolution: 'HD1080'
      pub_resolution: 'NATIVE'

    video:
      # 3-channel bgr8 instead of bgra8; rgb_image_relay.py turns it into rgb8.
      enable_24bit_output: true
      # Same as zed_shelf_cam.yaml: the upstream default clips the image to white under the lab lighting.
      brightness: 3
    depth:
      depth_mode: 'ULTRA'
      openni_depth_mode: true
      point_cloud_freq: 6.0

    pos_tracking:
      pos_tracking_enabled: false
