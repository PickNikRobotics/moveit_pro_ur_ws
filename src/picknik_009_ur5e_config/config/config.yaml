# Runtime launch entry point loaded by the MoveIt Pro runtime service (MoveIt Pro 10.0+).
# Inherited by the sim and hw child configs. Points at this config's agent + bridge graph,
# which includes studio_agent_bridge.launch.xml and the custom view pane server.
# [Required]
runtime_launch_file:
  package: "picknik_009_ur5e_config"
  path: "launch/agent_bridge.launch.xml"

# [Required]
hardware:
  # NOTE: `simulated` was removed in MoveIt Pro 10.0. Choose mock vs. real hardware via the
  # xacro `use_fake_hardware` parameter in urdf_params below (children override it).

  # If the MoveIt Pro Agent should launch the ros2 controller node.
  # [Optional, default=True]
  launch_control_node: True

  # If the MoveIt Pro Agent should launch the robot state publisher.
  # This should be false if you are launching the robot state publisher as part of drivers.
  # [Optional, default=True]
  launch_robot_state_publisher: True

  # robot_driver_persist_launch_file:
  #   package: "picknik_009_ur5e_config"
  #   path: "launch/robot_drivers_to_persist.launch.py"

  # Parameters used to configure the robot description through XACRO.
  # A URDF and SRDF are both required.
  # [Required]
  robot_description:
    urdf:
      package: "picknik_009_ur5e_config"
      path: "description/picknik_009_ur5e.urdf.xacro"
    srdf:
      package: "picknik_009_ur5e_config"
      path: "config/moveit/picknik_009_ur5e.srdf"
    # Specify any additional parameters required for the URDF.
    # Many of these are specific to the UR descriptions packages, and can be customized as needed.
    # [Optional]
    urdf_params:
      - name: "ur5e"
      # NOTE: If using a different UR model, update type here and joint limits in the config/moveit/joint_limits.yaml file.
      # possible 'ur_type' values: ur3, ur3e, ur5, ur5e, ur10, ur10e, ur16e, ur20, ur30
      - ur_type: "ur5e"
      - use_fake_hardware: "true"
      - fake_hw_mode: "mock"
      - robot_ip: "0.0.0.0"
      - has_tool_changer: "false"
      - headless_mode: "true"
      - use_tool_communication: "true"
      # - tool_voltage: "24"
      - joint_limit_parameters_file:
          package: "picknik_009_ur5e_config"
          path: "config/moveit/joint_limits.yaml"

# Configuration files for MoveIt.
# For more information, refer to https://moveit.picknik.ai/main/doc/how_to_guides/moveit_configuration/moveit_configuration_tutorial.html
# [Required]
moveit_params:
  # Used by the Waypoint Manager to save joint states from this joint group.
  joint_group_name: "manipulator"

  kinematics:
    package: "picknik_009_ur5e_config"
    path: "config/moveit/pose_ik_distance.yaml"
  sensors_3d:
    package: "picknik_009_ur5e_config"
    path: "config/moveit/sensors_3d.yaml"
  joint_limits:
    package: "picknik_009_ur5e_config"
    path: "config/moveit/joint_limits.yaml"
  pose_jog:
    package: "picknik_009_ur5e_config"
    path: "config/moveit/pose_jog.yaml"
  joint_jog:
    package: "picknik_009_ur5e_config"
    path: "config/moveit/joint_jog.yaml"

  publish:
    planning_scene: True
    geometry_updates: True
    state_updates: True
    transforms_updates: True

  trajectory_execution:
    manage_controllers: True
    allowed_execution_duration_scaling: 2.0
    allowed_goal_duration_margin: 5.0
    allowed_start_tolerance: 0.01

objectives:
  # List of plugins for loading custom behaviors.
  # [Required]
  behavior_loader_plugins:
    # This plugin will load the core MoveIt Pro Behaviors.
    # Add additional plugin loaders as needed.
    core:
      - "moveit_pro::behaviors::CoreBehaviorsLoader"
      - "moveit_pro::behaviors::MPCBehaviorsLoader"
      - "moveit_pro::behaviors::MTCCoreBehaviorsLoader"
      - "moveit_pro::behaviors::VisionBehaviorsLoader"
      - "moveit_pro::behaviors::ConverterBehaviorsLoader"
      - "moveit_pro::behaviors::MujocoBehaviorsLoader"
    epick:
      - "epick_moveit_studio::BehaviorLoader"
    custom:
      - "shelf_stocking_behaviors::ShelfStockingBehaviorsLoader"
      - "get_graspable_grocery_objects_from_masks3d::GetGraspableGroceryObjectsFromMasks3DBehaviorsLoader"
  objective_library_paths:
    # You must use a unique key for each package.
    core_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/core"
    motion_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/motion"
    perception_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/perception"
    # ur_mock_objectives:
    #   package_name: "picknik_009_ur5e_config"
    #   relative_path: "objectives"
    mujoco_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/mujoco"
    # The w_/x<N>_ prefixes are load-bearing: Pro 10 picks the winning file by the ALPHABETICAL order of these ids (see design_docs/objective_library_precedence.md). Keep shared (w) < x1 base < x2 sim < x3 hw < x4 end-effector variant, so a robot or gripper config overrides a shared Objective by giving its file the same name.
    w_shelf_stocking_objectives:
      package_name: "shelf_stocking_objectives"
      relative_path: "objectives"
    x1_site_objectives:
      package_name: "picknik_009_ur5e_config"
      relative_path: "objectives"
  # Specify the location of the saved waypoints file.
  # [Required]
  waypoints_file:
    package_name: "picknik_009_ur5e_config"
    relative_path: "waypoints/ur_waypoints.yaml"

# Configuration for launching ros2_control processes.
# [Required, if using ros2_control]
ros2_control:
  config:
    package: "picknik_009_ur5e_config"
    path: "config/control/ros2_controllers.yaml"
  # MoveIt Pro will load and activate these controllers at start up to ensure they are available.
  # If not specified, it is up to the user to ensure the appropriate controllers are active and available
  # for running the application.
  # [Optional, default=[]]
  controllers_active_at_startup:
    # - "force_torque_sensor_broadcaster"
    - "epick_controller"
    - "epick_status_publisher_controller"
    - "joint_state_broadcaster"
    - "policy_state_broadcaster"
    # - "io_and_status_controller"
  # Load but do not start these controllers so they can be activated later if needed.
  # [Optional, default=[]]
  controllers_inactive_at_startup:
    - "joint_trajectory_admittance_controller"
    - "velocity_force_controller"
    - "joint_velocity_controller"
  # Any controllers here will not be spawned by MoveIt Pro.
  # [Optional, default=[]]
  controllers_not_managed: []
  # Optionally configure remapping rules to let multiple controllers receive commands on the same topic.
  # [Optional, default=[]]
  controller_shared_topics: []
