# Workspace overrides, layered by the moveit_pro CLI on top of /opt/moveit_pro/docker-compose.yaml
# (moveit_pro_docker_wrapper.get_all_compose_files adds <workspace>/docker-compose.yaml when it
# exists). Declare only services that exist in that file, and only the keys being overridden:
# compose appends list values, so restating an entry the installed file already has is an error.
services:
  drivers:
    volumes:
      # The host's live USB device directory, in place of the start-time /dev snapshot,
      # so a USB device that re-enumerates under a running stack gets its new node.
      # The installed file already makes drivers privileged and allows c 189:*
      # (usb_device), so the missing node is the only obstacle. Relied on by the wrist
      # camera recovery (design_docs/wrist_camera_recovery.md).
      # Takes effect when the stack is started again through the moveit_pro CLI (the
      # container is recreated); `docker restart` keeps the old mounts.
      - /dev/bus/usb:/dev/bus/usb
      # udev's stable serial names (/dev/serial/by-id/...). The privileged container
      # gets the host's device nodes but not udev's symlinks, so without this the
      # 2F-85's robotiq_2f85_com_port has to name a ttyUSBn that renumbers when the
      # RS-485 bridge is replugged under a running stack. Read-only: udev owns it.
      # See design_docs/end_effector_variants.md.
      - /dev/serial:/dev/serial:ro
